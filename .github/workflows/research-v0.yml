# Research-v0 contract checks — additive CI for the research-only
# namespace.  This workflow validates contracts and boundaries only;
# it performs no data intake, downloads, clustering, or execution.
name: research-v0-contracts

on:
  push:
    paths:
      - "nepal/research_v0/**"
      - "nepal/era5_download.py"
      - "nepal/feature_extraction.py"
      - "nepal/gmm_descriptive.py"
      - "tests/test_research_v0_*.py"
      - "tests/test_p5_io_contract.py"
      - "docs/science/**"
      - ".github/workflows/research-v0.yml"
  pull_request:
    paths:
      - "nepal/research_v0/**"
      - "nepal/era5_download.py"
      - "nepal/feature_extraction.py"
      - "nepal/gmm_descriptive.py"
      - "tests/test_research_v0_*.py"
      - "tests/test_p5_io_contract.py"
      - "docs/science/**"
      - ".github/workflows/research-v0.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner and P5 io-contract deps
        run: >
          python -m pip install pytest numpy pandas xarray netcdf4
          scikit-learn scipy matplotlib

      - name: Frozen-boundary diff check (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          set -e
          git fetch --depth=2 origin ${{ github.base_ref }}
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- \
            nepal/framework_v1/ preregistration.md pinned/ data/ || true)
          if [ -n "$changed" ]; then
            echo "Frozen paths modified: $changed"; exit 1
          fi
          echo "frozen-path diff empty"

      - name: Frozen-boundary diff check (push)
        if: github.event_name == 'push'
        run: |
          set -e
          before="${{ github.event.before }}"
          # All-zero before-SHA means branch creation — fail closed on
          # the fixed baseline instead (P0-03).
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then
            before="5ef43c292ce41a93c9adec55185973caa7045285"
          fi
          changed=$(git diff --name-only "${before}..HEAD" -- \
            nepal/framework_v1/ preregistration.md pinned/ data/ || true)
          if [ -n "$changed" ]; then
            echo "Frozen paths modified: $changed"; exit 1
          fi
          echo "frozen-path diff empty"

      - name: Frozen-boundary check vs fixed baseline
        run: |
          set -e
          changed=$(git diff --name-only \
            5ef43c292ce41a93c9adec55185973caa7045285..HEAD -- \
            nepal/framework_v1/ preregistration.md pinned/ data/ || true)
          if [ -n "$changed" ]; then
            echo "Frozen paths differ from baseline: $changed"; exit 1
          fi
          echo "frozen paths identical to fixed baseline"

      - name: Research contract tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. \
            python -B -m pytest tests/test_research_v0_*.py -q -rs

      - name: P5 io-contract tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 PYTHONPATH=. \
            python -B -m pytest tests/test_p5_io_contract.py -q

      - name: ERA5 download dry-run gate
        run: python -B nepal/era5_download.py --dry-run

      - name: ERA5 NetCDF backend smoke gate
        run: python -B nepal/era5_download.py --smoke

      - name: Claim lint over governed artifacts
        run: |
          set -e
          for f in docs/science/* README.md .github/workflows/*.yml; do
            PYTHONPATH=. python -B -m nepal.research_v0.cli claim-scan "$f"
          done

      - name: Manifest byte verification
        run: |
          PYTHONPATH=. python -B -m nepal.research_v0.cli \
            verify-manifest docs/science/ARTIFACT_MANIFEST_V0.json

      - name: Disk reserve guard
        run: |
          avail=$(df -k . | awk 'NR==2 {print $4}')
          if [ "$avail" -lt 8388608 ]; then
            echo "disk reserve below 8 GiB"; exit 1
          fi
          echo "disk reserve ok: ${avail} KiB free"

      - name: Disk reserve check (8 GiB)
        run: |
          avail_kb=$(df -k . | awk 'NR==2 {print $4}')
          avail_gib=$((avail_kb / 1024 / 1024))
          echo "free: ${avail_gib} GiB"
          [ "$avail_gib" -ge 8 ]
